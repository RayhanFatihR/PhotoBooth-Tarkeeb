<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth Pameran — Photo Strip</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/download.css">

</head>
<body>

  <header class="header">
    <h1>Photo <span class="aksen">Pameran</span></h1>
    <p class="subjudul">3 foto otomatis • Photo strip kekinian • Langsung ke HP via QR</p>
  </header>

  <main class="layoutUtama">

    <!-- ══════════ PANEL KIRI: PREVIEW (sesi berjalan) ══════════ -->
    <section id="panelPreview" class="panel">
      <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>

        <!-- Kotak panduan posisi wajah (in-frame) -->
        <div id="panduanPreview">
          <div class="kotakPanduan"></div>
          <div class="labelPanduan">Posisikan wajah di dalam kotak</div>
        </div>

        <!-- Overlay countdown & flash -->
        <div id="countdownOverlay"></div>
        <div id="flashOverlay"></div>
      </div>

      <!-- Indikator sesi: foto 1/2/3 -->
      <div id="indikatorSesi">
        <span class="dot" id="dot1"></span>
        <span class="dot" id="dot2"></span>
        <span class="dot" id="dot3"></span>
      </div>

      <div id="awalanAksi">
        <button id="btnMulai" class="btnUtama">📸 Mulai Foto</button>
      </div>
    </section>

    <!-- ══════════ PANEL KANAN: HASIL (setelah sesi) ══════════ -->
    <section id="panelHasil" class="panel" style="display:none;">
      <div class="badgeBerhasil">✅ BERHASIL!</div>
      <h2>Photo Strip Kamu Siap!</h2>

      <!-- Preview hasil strip -->
      <div id="previewHasil">
        <img id="imgHasil" alt="Photo Strip">
      </div>

      <!-- Tombol Foto Lagi — di bawah strip, SEBELUM QR -->
      <button id="btnFotoLagi" class="btnUtama">⟳ Foto Lagi</button>

      <!-- Bagian QR download -->
      <div id="bagianQR">
        <p class="infoQR">Scan untuk download ke HP 📱</p>
        <div id="qrBox"></div>
        <p class="infoKecil" id="linkDownload"></p>
      </div>
    </section>

  </main>

  <!-- Library QR -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
